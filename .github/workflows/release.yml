# Builds the plugin from source and publishes a GitHub release with
# build-provenance attestations whenever a version tag (e.g. 1.0.1) is
# pushed. The attestation lets anyone cryptographically verify the release
# assets were built from this repository - the Obsidian directory's
# automated review checks for it.
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" main.js manifest.json \
            --title "${{ github.ref_name }}" \
            --notes "Built and attested by GitHub Actions from this repository. See the README for setup."
